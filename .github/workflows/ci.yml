name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Test session logic and write sample FIT files
        env:
          RUN_GUIDE_FIT_OUT: ${{ github.workspace }}/build/fit
        run: swift test --package-path RunGuideCore

      - name: Validate FIT files with Garmin's FIT SDK
        run: |
          python3 -m pip install --quiet --break-system-packages garmin-fit-sdk
          python3 scripts/validate_fit.py build/fit/full.fit --laps 12 --hr --gps
          python3 scripts/validate_fit.py build/fit/no-gps-no-hr.fit --laps 12

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone app (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project RunGuide.xcodeproj \
            -scheme RunGuide \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 80

      - name: Build unsigned iPhone app (.ipa) for sideloading
        run: |
          set -o pipefail
          xcodebuild \
            -project RunGuide.xcodeproj \
            -scheme RunGuide \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40
          mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/RunGuide.app build/ipa/Payload/
          cd build/ipa && zip -qry ../RunGuide-unsigned.ipa Payload
          ls -la ../RunGuide-unsigned.ipa

      - name: Keep the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: RunGuide-unsigned-ipa
          path: build/RunGuide-unsigned.ipa
          if-no-files-found: error

      - name: Keep sample FIT files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-fit-files
          path: build/fit
          if-no-files-found: ignore
