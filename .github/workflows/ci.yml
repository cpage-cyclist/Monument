name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Test session logic
        run: swift test --package-path RunGuideCore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone app (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project RunGuide.xcodeproj \
            -scheme RunGuide \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 80
