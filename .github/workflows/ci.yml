name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Prepare
        run: mkdir -p build

      - name: Test session logic and write sample FIT files
        env:
          RUN_GUIDE_FIT_OUT: ${{ github.workspace }}/build/fit
        run: |
          set -o pipefail
          if ! swift test --package-path RunGuideCore 2>&1 | tee build/test.log; then
            # Surface the failures as annotations (readable without the full log).
            grep -E "error:|failed|XCTAssert|fatal" build/test.log | head -40 > build/fail.txt || true
            echo "::error title=swift test failed::$(sed -e 's/%/%25/g' build/fail.txt | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Validate FIT files with Garmin's FIT SDK
        run: |
          python3 -m pip install --quiet --break-system-packages garmin-fit-sdk
          python3 scripts/validate_fit.py build/fit/full.fit --laps 12 --hr --gps
          python3 scripts/validate_fit.py build/fit/no-gps-no-hr.fit --laps 12

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone app (simulator, unsigned)
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project RunGuide.xcodeproj \
            -scheme RunGuide \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build > build/app.log 2>&1; then
            grep -E "error:" build/app.log | sort -u | head -40 > build/fail.txt || true
            echo "::error title=app build failed::$(sed -e 's/%/%25/g' build/fail.txt | awk '{printf "%s%%0A", $0}')"
            tail -n 80 build/app.log
            exit 1
          fi
          tail -n 20 build/app.log

      - name: Build unsigned iPhone app (.ipa) for sideloading
        run: |
          set -o pipefail
          xcodebuild \
            -project RunGuide.xcodeproj \
            -scheme RunGuide \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 40
          mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/RunGuide.app build/ipa/Payload/
          cd build/ipa && zip -qry ../Monument-unsigned.ipa Payload
          ls -la ../Monument-unsigned.ipa

      - name: Keep the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Monument-unsigned-ipa
          path: build/Monument-unsigned.ipa
          if-no-files-found: error

      - name: Keep sample FIT files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-fit-files
          path: build/fit
          if-no-files-found: ignore
