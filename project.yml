name: RunGuide
options:
  bundleIdPrefix: com.cpage
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  RunGuideCore:
    path: RunGuideCore
targets:
  RunGuide:
    type: application
    platform: iOS
    sources:
      - RunGuide
    dependencies:
      - package: RunGuideCore
    info:
      path: RunGuide/Info.plist
      properties:
        CFBundleDisplayName: Monument
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Akira (demo, personal use) for the hero numbers; the wordmark itself is SVG artwork.
        UIAppFonts:
          - AkiraExpanded-SuperBold.otf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Monument uses GPS to measure distance so it can call out each step of your run.
        NSLocationAlwaysAndWhenInUseUsageDescription: Monument uses GPS to measure distance so it can call out each step of your run, including with the screen locked.
        NSBluetoothAlwaysUsageDescription: Monument connects to your heart-rate strap to show and record heart rate.
        UIBackgroundModes:
          - location
          - audio
          - bluetooth-central
        # Strava sign-in calls back to monument://localhost (Run Guide keeps runguide://)
        CFBundleURLTypes:
          - CFBundleURLName: com.cpage.monument.strava
            CFBundleURLSchemes:
              - monument
        # Needed to check whether the Strava app is installed (app-to-app sign-in).
        LSApplicationQueriesSchemes:
          - strava
        # Lets GPX/TCX files (e.g. AirDropped from Strava) open in Monument.
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPS route
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.topografix.gpx
              - com.garmin.tcx
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX route
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
          - UTTypeIdentifier: com.garmin.tcx
            UTTypeDescription: TCX course
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - tcx
        # Show saved FIT files in the Files app (On My iPhone › Monument).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        # Its own app, installed alongside Run Guide (com.cpage.runguide).
        PRODUCT_BUNDLE_IDENTIFIER: com.cpage.monument
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
